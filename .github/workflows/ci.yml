name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install CPU-only dependencies (no torch / nerfstudio needed for the maths, data and statistics tests)
        run: pip install numpy scipy scikit-image pillow pandas matplotlib pyyaml pytest ruff
      - run: ruff check .
      - run: python -m compileall -q freenerf_ns evalkit scripts
      - run: pytest -q
